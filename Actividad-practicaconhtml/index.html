<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página Principal - Login</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio (Login)</a> | 
            <a href="tags.html">Etiquetas HTML</a> | 
            <a href="profile.html">Perfil</a>
        </nav>
    </header>

    <div>
        <h1>Iniciar Sesión</h1>
        <p>Ingresa tus credenciales para acceder a la plataforma.</p>
        
        <form>
            <div>
                <label for="username">Usuario: </label><br />
                <input type="text" id="username" name="username" placeholder="Nombre de usuario">
            </div>
            <br />
            <div>
                <label for="password">Contraseña: </label><br />
                <input type="password" id="password" name="password" placeholder="Contraseña">
            </div>
            <br />
            <div>
                <button type="submit"><strong>Ingresar</strong></button>
            </div>
        </form>
    </div>
</body>
</html>
